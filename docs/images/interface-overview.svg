<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 550" role="img" aria-labelledby="title desc">
  <title id="title">ShDisplayViewer 界面分区示意</title>
  <desc id="desc">顶部为项目与工作区，左侧为方案树，中间为地图，右侧为对象信息，底部为播放控制和时间轴。这是结构示意，不是运行截图。</desc>
  <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#eaf3fb;font-size:18px}.small{font-size:15px;fill:#bfd0df}.label{font-size:21px;font-weight:700}.box{fill:#153d5d;stroke:#407b9f;stroke-width:1.5}</style>
  <rect width="1040" height="550" rx="16" fill="#0b2439"/>
  <text x="26" y="35" class="label">界面分区</text><text x="790" y="34" class="small">结构示意 · 非运行截图</text>
  <rect x="20" y="52" width="1000" height="48" rx="7" class="box"/>
  <text x="38" y="82">项目 / 资源 / 帮助（保存与演示副本在项目菜单）　　标题栏：全屏 / 还原</text>
  <rect x="20" y="110" width="1000" height="48" rx="7" class="box"/>
  <text x="38" y="141">01 基础场景</text><text x="280" y="141">02 部署标注</text>
  <rect x="519" y="117" width="252" height="34" rx="5" fill="#147b91"/><text x="536" y="141">03 动态演练</text>
  <rect x="20" y="170" width="224" height="240" rx="7" class="box"/>
  <text x="37" y="202" class="label">方案与步骤</text>
  <text x="39" y="242">▾ 演练方案</text><text x="58" y="277">▾ 步骤</text><text x="80" y="312">标记 / 路线 / 区域</text>
  <text x="37" y="374" class="small">选择对象 · 右键编辑</text>
  <rect x="256" y="170" width="507" height="240" rx="7" fill="#edf5f6"/>
  <path d="M283 340 L384 340 L434 286 L620 286" fill="none" stroke="#218aac" stroke-width="7" stroke-linejoin="round"/>
  <path d="M614 273 L637 286 L614 299Z" fill="#218aac"/>
  <circle cx="350" cy="340" r="12" fill="#147b91"/><circle cx="640" cy="286" r="15" fill="#e46a48"/>
  <text x="292" y="212" style="fill:#14374b;font-size:23px;font-weight:700">地图与部署态势</text>
  <text x="292" y="240" style="fill:#3f5968;font-size:16px">浏览 · 绘制 · 镜头切换</text>
  <text x="286" y="384" style="fill:#3f5968;font-size:15px">路线与点位仅用于界面示意</text>
  <rect x="775" y="170" width="245" height="240" rx="7" class="box"/>
  <text x="794" y="202" class="label">对象信息</text><text x="794" y="243">名称与说明</text><text x="794" y="277">属性与视角信息</text>
  <rect x="20" y="423" width="1000" height="75" rx="7" class="box"/>
  <text x="38" y="452">上一步　 播放 / 暂停　 下一步　 停止</text>
  <path d="M40 476 H995" stroke="#407b9f" stroke-width="9"/><path d="M40 476 H405" stroke="#4bc4d4" stroke-width="9"/>
  <circle cx="405" cy="476" r="7" fill="#fff"/><text x="740" y="451" class="small">步骤时间轴 · 定位与回看</text>
  <text x="26" y="531" class="small">状态栏：绘制提示、当前步骤、保存结果与错误信息</text>
</svg>
